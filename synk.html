<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Join SYNK Drop 01 early access." />
  <title>SYNK — Drop 01 Early Access</title>
  <link rel="stylesheet" href="/synk.css" />
</head>
<body class="signup-page">
  <main class="signup-card">
    <p class="brand">SYNK</p>
    <p class="eyebrow">DROP 01 / EARLY ACCESS</p>
    <h1>BE FIRST.<br /><span>STAY SYNK.</span></h1>
    <p>Get first access when Drop 01 opens.</p>
    <form id="signup-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com" />
      <button type="submit">JOIN EARLY ACCESS</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>
  <script src="/synk.js"></script>
</body>
</html>
